spring:
  datasource:
    url: jdbc:mariadb://127.0.0.1:3306/boxing_bracket
    driver-class-name: org.mariadb.jdbc.Driver
    username: boxing
    password: boxing

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    out-of-order: false
