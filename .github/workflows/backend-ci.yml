name: Backend CI

on:
  push:
    paths:
      - 'back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'back/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: boxing_bracket
          MARIADB_USER: boxing
          MARIADB_PASSWORD: boxing
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uboxing -pboxing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: back
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: back/pom.xml

      - name: Report tool versions
        run: |
          java -version
          mvn --version

      - name: Run backend tests
        run: mvn -q test

      - name: Run MariaDB migration smoke test
        run: mvn -q -Dtest=MariaDbMigrationSmokeIT -Dmariadb.integration=true test
